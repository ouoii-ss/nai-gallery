<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAI 画廊 · NAI 画师串</title>
<link rel="stylesheet" href="styles.css?v=20260905n5">
</head>
<body>
<!-- Discord 登录墙：未登录时盖住整个画廊（仅配置并登录后可见） -->
<div id="loginWall" class="login-wall hidden">
  <div class="lw-card">
    <div class="lw-emoji">🔒</div>
    <h1>私人 NAI 画廊</h1>
    <p id="loginMsg" class="muted">用 Discord 登录后才能查看 · 仅你自己可见</p>
    <button id="loginBtn" class="btn-dc">🔑 用 Discord 登录</button>
    <p class="lw-note">数据仅你本人可看。手机 / 电脑都能登。</p>
  </div>
</div>

<!-- NOCTURNE 风外壳：磨砂玻璃 Mac 窗口 -->
<div class="window-shell">
  <!-- Mac 红绿灯 -->
  <div class="traffic-lights" aria-hidden="true">
    <span class="traffic-light red"></span>
    <span class="traffic-light yellow"></span>
    <span class="traffic-light green"></span>
  </div>

  <!-- 右上角登录态 -->
  <div id="userChip" class="user-chip hidden"></div>

  <!-- 顶部胶囊视图切换 -->
  <div class="top-pills" role="tablist">
    <button class="top-pill active" data-view="gallery" type="button">
      <span class="tp-ico">✦</span>画廊<span class="tp-sub">Gallery</span>
    </button>
    <button class="top-pill" data-view="gaca" type="button">
      <span class="tp-ico">✶</span>抽卡<span class="tp-sub">Gacha</span>
    </button>
    <button class="top-pill" data-view="vibe" type="button">
      <span class="tp-ico">✿</span>Vibe<span class="tp-sub">Vibes</span>
    </button>
  </div>

  <!-- 手机端侧栏抽屉开关 -->
  <button id="navToggle" class="nav-toggle" type="button" aria-label="菜单">☰</button>
  <div id="navBackdrop" class="nav-backdrop"></div>

  <div class="app">
    <!-- 左侧栏：可折叠圆形图标 -->
    <aside class="sidebar">
      <button class="sidebar-pin" id="sidebarPin" type="button" title="钉住/取消钉住（点此可保持展开状态）">📌</button>

      <div class="brand-wrap">
        <div class="brand-mark">N</div>
        <div>
          <div class="brand-logo">NAI 画廊库</div>
          <div class="brand-sub">Artist Gallery</div>
        </div>
      </div>

      <div class="sidebar-foot">
        <button class="user-pill" id="themeToggle" type="button" title="点击切换日 / 夜模式" aria-label="切换日 / 夜模式">
          <span class="theme-ico" aria-hidden="true">◐</span>
          <span class="theme-text">日间</span>
        </button>
        <div class="stat-line" id="stat"></div>
      </div>
    </aside>

    <!-- 主区 -->
    <div class="main">
      <!-- 画廊 -->
      <section id="view-gallery" class="view">
        <!-- NOCTURNE 风大标题 hero -->
        <div class="hero">
          <div class="hero-eyebrow">Artist Gallery</div>
          <h1 class="hero-title"></h1>
          <div class="hero-sub">A quiet collection of dreams</div>
          <div class="hero-meta"><span id="heroMeta">—</span></div>
        </div>

        <div class="filters">
          <input id="search" class="f-search" placeholder="搜索画师 / 提示词 / 标签 / 批次…">
          <select id="fArtist" class="f-sel"><option value="">全部画师</option></select>
          <select id="fBatch" class="f-sel"><option value="">全部批次</option></select>
          <select id="fSort" class="f-sel">
            <option value="new">最新优先</option>
            <option value="old">最早优先</option>
            <option value="artist">按画师</option>
          </select>
          <label class="hideToggle" id="hideToggleWrap" style="display:none"><input type="checkbox" id="showHidden"> 显示被隐藏的</label>
        </div>
        <div id="grid" class="grid"></div>
        <div id="pager" class="pager"></div>
        <div id="empty" class="empty hidden">没有匹配的画作</div>
      </section>

      <!-- 抽卡 / 塔罗 -->
      <section id="view-gaca" class="view hidden">
        <div class="gaca-controls">
          <button id="draw1" class="btn-primary">✶ 抽一张</button>
          <button id="draw3" class="btn-primary">🔮 塔罗三张</button>
          <button id="drawReset" class="btn-ghost">清空</button>
        </div>
        <div id="gacaStage" class="gaca-stage"></div>
        <p class="muted center">从已解锁的画作里随机抽一张，翻牌看看今天画了啥 ✦</p>
      </section>

      <!-- Vibe -->
      <section id="view-vibe" class="view hidden">
        <div id="vibeGrid" class="grid vibe-grid"></div>
      </section>
    </div>
  </div>
</div>

<!-- 灯箱 -->
<div id="lightbox" class="lightbox hidden">
  <div class="lb-back" id="lbBack"></div>
  <div class="lb-card">
    <button class="lb-x" id="lbX">✕</button>
    <img id="lbImg" class="lb-img" alt="">
    <div class="lb-meta">
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-artist" id="lbArtist"></div>
      <div class="lb-prompt">
        <div class="lb-prompt-head"><span>Positive</span><button class="copyBtn" data-copy="lbPos">📋 复制</button></div>
        <textarea id="lbPos" readonly rows="4"></textarea>
      </div>
      <div class="lb-prompt">
        <div class="lb-prompt-head"><span>Negative</span><button class="copyBtn" data-copy="lbNeg">📋 复制</button></div>
        <textarea id="lbNeg" readonly rows="2"></textarea>
      </div>
      <div class="lb-tags" id="lbTags"></div>
      <div class="lb-acts">
        <button id="lbDlImg" class="copyBtn">⬇ 下载图片</button>
        <button id="lbDlTxt" class="copyBtn">⬇ 下载提示词</button>
        <button id="lbDlVibe" class="copyBtn" style="display:none">⬇ 下载 Vibe</button>
      </div>
      <div class="lb-nav"><button id="lbPrev">← 上一张</button><button id="lbNext">下一张 →</button></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 兜底：file:// 直接双击打开时由 seed.js 提供数据；HTTP 部署时 app.js 会优先 fetch data/index.json -->
<script src="data/seed.js"></script>
<!-- 测试/调试用：覆盖 Discord Client ID（生产留空，由 app.js 常量接管） -->
<script>window.__DC_ID_OVERRIDE = window.__DC_ID_OVERRIDE || '';</script>
<script src="app.js?v=20260905n5"></script>
</body>
</html>
